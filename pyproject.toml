[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Lightweight multi-agent orchestration framework (LangGraph-style) with Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "google-genai>=1.0.0",
  "duckduckgo-search>=6.3.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "slowapi>=0.1.9",
  "cachetools>=5.5.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "anyio>=4.6.0",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]

[tool.hatch.build.targets.wheel.sources]
"src/agent_orchestrator" = "agent_orchestrator"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]